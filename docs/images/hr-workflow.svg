  <text x="637.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Inbox chat, interview</text>
  <text x="637.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">invitation email</text>
  <polyline points="717.0,180.0 722.0,180.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round"/>
