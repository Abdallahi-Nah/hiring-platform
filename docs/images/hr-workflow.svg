  <text x="287.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Transcription, CV parsing,</text>
  <text x="287.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">score and summary</text>
  <polyline points="367.0,180.0 372.0,180.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="382.0,180.0 372.9,184.1 372.9,175.9" fill="#57606a"/>
  <rect x="382" y="130" width="160" height="100" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <rect x="392" y="130" width="140" height="5" rx="2.5" fill="#0969da"/>
  <text x="462.0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Review</text>
  <text x="462.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">List or Kanban board,</text>
  <text x="462.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">notes, CV search</text>
  <polyline points="542.0,180.0 547.0,180.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="557.0,180.0 547.9,184.1 547.9,175.9" fill="#57606a"/>
