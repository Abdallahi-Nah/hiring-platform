  <text x="112.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Bell + toast in real time</text>
  <text x="112.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Email to HR</text>
  <polyline points="192.0,180.0 197.0,180.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="207.0,180.0 197.9,184.1 197.9,175.9" fill="#57606a"/>
  <rect x="207" y="130" width="160" height="100" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8"/>
