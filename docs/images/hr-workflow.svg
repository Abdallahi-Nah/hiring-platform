  <text x="812.0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Interview</text>
  <text x="812.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Upload recording,</text>
  <text x="812.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">AI interview analysis</text>
  <polyline points="892.0,180.0 897.0,180.0" fill="none" stroke="#57606a" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="907.0,180.0 897.9,184.1 897.9,175.9" fill="#57606a"/>
  <rect x="907" y="130" width="160" height="100" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <rect x="917" y="130" width="140" height="5" rx="2.5" fill="#8250df"/>
  <text x="987.0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Decision</text>
  <text x="987.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Offer or reject</text>
  <text x="987.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">(Admin and above)</text>
  <rect x="32" y="290" width="1036" height="180" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
