<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d">
  <title id="t">HR workflow</title>
  <desc id="d">From a new application to the final decision.</desc>
  <rect x="0.75" y="0.75" width="1098.5" height="518.5" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="32" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">HR workflow</text>
  <text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#656d76" text-anchor="start">AI suggests, people decide. Every step stays inside the company's own data.</text>
  <rect x="32" y="130" width="160" height="100" rx="10" fill="#ffffff" stroke="#00b141" stroke-width="1.8"/>
  <rect x="42" y="130" width="140" height="5" rx="2.5" fill="#00b141"/>
