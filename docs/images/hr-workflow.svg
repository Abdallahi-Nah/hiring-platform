  <text x="168.0" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Dashboard</text>
  <text x="168.0" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Views, conversion,</text>
  <text x="168.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">time to hire</text>
  <rect x="304" y="340" width="232" height="110" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <rect x="314" y="340" width="212" height="5" rx="2.5" fill="#8250df"/>
  <text x="420.0" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Email templates</text>
  <text x="420.0" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Reject, invite, offer</text>
  <text x="420.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">in EN, FR, AR</text>
  <rect x="556" y="340" width="232" height="110" rx="10" fill="#ffffff" stroke="#00b141" stroke-width="1.8"/>
  <rect x="566" y="340" width="212" height="5" rx="2.5" fill="#00b141"/>
  <text x="672.0" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Exports</text>
  <text x="672.0" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Excel, CSV, PDF</text>
  <text x="672.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">(Latin and Arabic)</text>
  <rect x="808" y="340" width="232" height="110" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <rect x="818" y="340" width="212" height="5" rx="2.5" fill="#0969da"/>
  <text x="924.0" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Company page</text>
  <text x="924.0" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Public /c/company</text>
  <text x="924.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">with open jobs</text>
  <text x="32" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="start">Roles: Reviewers can read and chat, Admins also invite and decide, Super Admins also manage users and the company.</text>
