  <rect x="770" y="280" width="260" height="5" rx="2.5" fill="#00b141"/>
  <text x="900.0" y="310" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Realtime (WebSocket)</text>
  <text x="900" y="372" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">private buckets: resumes, audio, CV</text>
  <rect x="740" y="420" width="320" height="72" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8"/>
  <rect x="750" y="420" width="300" height="5" rx="2.5" fill="#bc4c00"/>
  <text x="900.0" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Groq AI</text>
  <text x="900.0" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Speech to text, CV parsing, scoring</text>
  <rect x="740" y="504" width="320" height="72" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8"/>
  <rect x="750" y="504" width="300" height="5" rx="2.5" fill="#bc4c00"/>
  <text x="900.0" y="534" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Gmail SMTP</text>
  <text x="900.0" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Confirmation, invites, decisions, alerts</text>
