  <text x="420" y="636" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#00b141" text-anchor="middle">live messages and notifications over WebSocket</text>
  <text x="32" y="682" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="start">Rule: the service-role key is used on the server only, always after an RLS-scoped check of the signed-in user.</text>
