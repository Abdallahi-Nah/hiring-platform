<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d">
  <title id="t">System architecture</title>
  <desc id="d">Browsers talk to a Next.js app on Vercel, which uses Supabase, Groq and Gmail.</desc>
  <rect x="0.75" y="0.75" width="1098.5" height="698.5" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="32" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">System architecture</text>
  <text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#656d76" text-anchor="start">Next.js on Vercel in the middle; Supabase, Groq AI and Gmail around it.</text>
  <rect x="40" y="120" width="200" height="110" rx="10" fill="#ffffff" stroke="#00b141" stroke-width="1.8"/>
  <rect x="50" y="120" width="180" height="5" rx="2.5" fill="#00b141"/>
  <text x="140.0" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Candidate</text>
  <text x="140.0" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Browser, phone or laptop</text>
  <text x="140.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Jobs, apply, track, chat</text>
  <rect x="40" y="330" width="200" height="110" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <rect x="50" y="330" width="180" height="5" rx="2.5" fill="#8250df"/>
  <text x="140.0" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">HR team</text>
  <text x="140.0" y="382" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Super Admin, Admin, Reviewer</text>
  <text x="140.0" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Dashboard, Kanban, inbox</text>
  <rect x="300" y="100" width="380" height="450" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Next.js 16 on Vercel</text>
  <rect x="325" y="150" width="330" height="78" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <rect x="335" y="150" width="310" height="5" rx="2.5" fill="#0969da"/>
  <text x="490.0" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Public site</text>
  <text x="490.0" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Jobs, apply, /track/token, /c/company</text>
  <rect x="325" y="242" width="330" height="78" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <rect x="335" y="242" width="310" height="5" rx="2.5" fill="#0969da"/>
  <text x="490.0" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Candidate space</text>
  <text x="490.0" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">/me: profile, CV, saved jobs, alerts</text>
  <rect x="325" y="334" width="330" height="78" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <rect x="335" y="334" width="310" height="5" rx="2.5" fill="#0969da"/>
  <text x="490.0" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Admin</text>
  <text x="490.0" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">/admin: jobs, candidates, messages, templates</text>
  <rect x="325" y="426" width="330" height="100" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <rect x="335" y="426" width="310" height="5" rx="2.5" fill="#0969da"/>
  <text x="490.0" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">API, Server Actions, Cron</text>
  <text x="490.0" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Auth checks, rate limits, AI jobs</text>
  <text x="490.0" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#656d76" text-anchor="middle">Retention 03:00, job alerts 07:00</text>
  <rect x="740" y="100" width="320" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="900" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Supabase</text>
  <rect x="760" y="148" width="280" height="56" rx="10" fill="#ffffff" stroke="#00b141" stroke-width="1.8"/>
