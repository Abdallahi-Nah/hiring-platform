  <text x="900.0" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Postgres + Row Level Security</text>
  <rect x="760" y="214" width="135" height="56" rx="10" fill="#ffffff" stroke="#00b141" stroke-width="1.8"/>
  <rect x="770" y="214" width="115" height="5" rx="2.5" fill="#00b141"/>
  <text x="827.5" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Auth</text>
  <rect x="905" y="214" width="135" height="56" rx="10" fill="#ffffff" stroke="#00b141" stroke-width="1.8"/>
  <rect x="915" y="214" width="115" height="5" rx="2.5" fill="#00b141"/>
  <text x="972.5" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Storage</text>
