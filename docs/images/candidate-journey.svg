  <text x="552" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">Saved jobs</text>
  <rect x="660" y="352" width="184" height="56" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="752" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">Daily job alerts by email</text>
  <rect x="860" y="352" width="184" height="56" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
