<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d">
  <title id="t">Candidate journey</title>
  <desc id="d">From browsing a job to the final decision.</desc>
  <rect x="0.75" y="0.75" width="1098.5" height="468.5" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
