name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Translations
        run: npx tsx --tsconfig tsconfig.json scripts/check-i18n.ts
      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne contacte pas les services.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
